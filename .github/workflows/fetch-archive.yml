name: Fetch project archive from Google Drive

on:
  push:
    branches:
      - arena/01a0af27-sagu
    paths:
      - .github/workflows/fetch-archive.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0af27-sagu
          fetch-depth: 0

      - name: Download archive from Google Drive
        run: |
          set -euxo pipefail
          pip install gdown
          gdown --fuzzy "https://drive.google.com/file/d/1p7pCYIUU1xHx1U2sVqmycBomQLHVxuk7/view?usp=drive_link" -O /tmp/project.zip || \
            curl -fL -o /tmp/project.zip "https://drive.usercontent.google.com/download?id=1p7pCYIUU1xHx1U2sVqmycBomQLHVxuk7&export=download&confirm=t"
          file /tmp/project.zip
          ls -la /tmp/project.zip

      - name: Commit archive
        run: |
          set -ux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p incoming
          cp /tmp/project.zip "incoming/Subsistence_1.0.0-alpha.zip" || true
          git add incoming || true
          if git diff --staged --quiet; then echo "archive already in repo, nothing to commit"; exit 0; fi
          git commit -m "incoming: add Subsistence_1.0.0-alpha project archive"
          for i in 1 2 3; do
            git pull --rebase origin arena/01a0af27-sagu && git push origin arena/01a0af27-sagu && exit 0
            sleep 5
          done
          exit 1
