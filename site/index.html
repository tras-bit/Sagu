<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUBSISTENCE · каталог моделей</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">SUBSISTENCE<span>каталог моделей · 3D</span></div>
  <input id="q" type="search" placeholder="поиск: ak, door, smiler, vending…" autocomplete="off">
  <nav id="cats"></nav>
  <div id="count"></div>
</header>
<main id="grid"></main>

<div id="viewer" class="hidden">
  <button id="close" title="закрыть (Esc)">&#10005;</button>
  <button id="prev" title="назад (&larr;)">&#8249;</button>
  <button id="next" title="вперёд (&rarr;)">&#8250;</button>
  <div id="panel">
    <div id="vname"></div>
    <div id="vinfo"></div>
    <div class="row">
      <button id="autorot" class="on">вращение</button>
      <button id="wire">сетка</button>
      <span class="hint">мышь — вращать · колесо — зум</span>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
